<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff4d8">
    <meta name="description" content="Pegá el link de un tuit y bajá el video. Se arma en el navegador.">
    <title>Twitter · utils</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c5b6ff' stroke='%23241c16' stroke-width='4'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial Black,sans-serif' font-size='32' fill='%23241c16'%3EX%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="page">
      <a class="back" href="./index.html"><span aria-hidden="true">←</span> utils</a>

      <header class="tool-head">
        <p class="tape tape-small">marcador violeta</p>
        <h1>Twitter</h1>
        <p class="lede">Pegá el link de un tuit. Si el video es público y viene en MP4, lo podés ver, compartir o guardar.</p>
      </header>

      <form class="panel" id="form">
        <label class="field-top" for="link">Link del tuit</label>
        <input id="link" class="text-input" type="url" inputmode="url" autocomplete="off" placeholder="https://x.com/…/status/…" required>
        <div class="actions">
          <button type="submit" id="fetch" class="btn btn-primary">Descargar</button>
        </div>
      </form>

      <p class="status" id="status" role="status" hidden></p>

      <div class="actions" id="direct-actions" hidden>
        <a id="direct" class="btn" href="" target="_blank" rel="noopener noreferrer">Abrir el video</a>
      </div>

      <section class="panel result" id="result" hidden>
        <h2>Listo</h2>
        <video id="video" playsinline controls preload="metadata"></video>
        <p class="file-meta" id="file-meta"></p>
        <div class="actions">
          <button type="button" id="share" class="btn btn-teal" hidden>Compartir</button>
          <button type="button" id="download" class="btn btn-pink">Descargar</button>
        </div>
        <p class="hint">En el celular, Compartir manda el archivo. Si no aparece, usá Descargar.</p>
        <p class="status" id="copy-status" role="status" hidden></p>
      </section>

      <noscript>
        <p class="note">Necesitás JavaScript para bajar el video.</p>
      </noscript>
    </div>
    <script type="module" src="./twitter.js"></script>
  </body>
</html>
