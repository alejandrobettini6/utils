<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff4d8">
    <title>Unidades · utiles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="page">
      <a class="back" href="./datos.html"><span aria-hidden="true">←</span> Texto y datos</a>
      <header class="tool-head">
        <h1>Unidades</h1>
        <p class="lede">Longitud, peso, temperatura y tiempo. La cuenta se hace acá.</p>
      </header>
      <label class="field-top" for="tipo">Tipo</label>
      <select id="tipo" class="select-input">
        <option value="longitud">Longitud</option>
        <option value="peso">Peso</option>
        <option value="temperatura">Temperatura</option>
        <option value="tiempo">Tiempo</option>
      </select>
      <label class="field-top" for="valor">Valor</label>
      <input id="valor" class="text-input" type="number" inputmode="decimal" value="1" step="any">
      <label class="field-top" for="desde">Desde</label>
      <select id="desde" class="select-input"></select>
      <label class="field-top" for="hacia">Hacia</label>
      <select id="hacia" class="select-input"></select>
      <p class="file-meta" id="resultado">—</p>
    </div>
    <script type="module" src="./unidades.js"></script>
  </body>
</html>
