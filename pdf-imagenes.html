<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff4d8">
    <title>Imágenes a PDF · utiles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="page">
      <a class="back" href="./pdfs.html"><span aria-hidden="true">←</span> PDF</a>
      <header class="tool-head">
        <h1>Imágenes a PDF</h1>
        <p class="lede">Cada foto queda en una página. No se sube nada.</p>
      </header>
      <label class="drop">
        <input id="files" class="drop-input" type="file" accept="image/jpeg,image/png,image/webp" multiple>
        <span class="drop-copy"><span class="drop-badge">Img</span><strong id="drop-title">Elegí una o más fotos</strong></span>
      </label>
      <div id="lista"></div>
      <div class="actions"><button class="btn btn-primary" id="run" type="button">Armar PDF</button></div>
      <p class="status" id="status" role="status" hidden></p>
      <section class="panel result" id="result" hidden>
        <h2>Listo</h2>
        <iframe id="preview" title="Vista previa del PDF"></iframe>
        <button class="btn btn-pink" id="download" type="button">Descargar</button>
      </section>
    </div>
    <script src="./vendor/pdf-lib.js"></script>
    <script type="module" src="./pdf-imagenes.js"></script>
  </body>
</html>
